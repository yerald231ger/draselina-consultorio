# Integración continua: en cada push a main (y a mano) compila la solución y corre todas las pruebas, incluidas las
# de arquitectura (AD-1) y las de integración contra PostgreSQL real. No publica nada: el despliegue a Azure se hace
# aparte, con azd (docs/despliegue.md).
name: Pruebas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      # El SDK que pide global.json (10.0.402 o una banda posterior de .NET 10).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Las advertencias son errores (Directory.Build.props): una advertencia rompe la compilación.
      - name: Compilar
        run: ./dotnet.sh build

      # IntegrationTests levanta PostgreSQL con Testcontainers: el Docker del runner de Ubuntu basta.
      - name: Probar
        run: ./dotnet.sh test --no-build
