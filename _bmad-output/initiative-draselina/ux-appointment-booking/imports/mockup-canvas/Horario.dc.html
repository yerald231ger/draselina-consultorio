<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agendar cita — día y hora</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B2A45}a:hover{color:#4F1E33}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #FBF6F5; color: #3A1F29; font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 12px 12px 0; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="Regresar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #3A1F29">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <div style="font-size: 14px; font-weight: 600; color: #6E5560">Primera consulta · 30 min</div>
  </div>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 6px" aria-label="Paso 2 de 3">
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #6B2A45"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #6B2A45"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #E7D3D3"></div>
    </div>
    <div style="font-size: 12px; font-weight: 600; color: #8A4F5A; text-transform: uppercase; letter-spacing: 0.14em">Paso 2 de 3</div>
    <h1 style="margin: 4px 0 0; font-size: 24px; font-weight: 600; color: #6B2A45">Elige día y hora</h1>
  </div>

  <div style="padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center">
    <div style="font-size: 15px; font-weight: 700">Octubre 2026</div>
    <div style="font-size: 13px; color: #6E5560">Hasta el 4 de diciembre</div>
  </div>

  <div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 4px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="6">
      <button type="button" onClick="{{d.pick}}" disabled="{{d.full}}" aria-pressed="{{d.selected}}" aria-label="{{d.aria}}" style="{{d.chipStyle}}">
        <span style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em">{{d.dow}}</span>
        <span style="font-size: 20px; font-weight: 700">{{d.num}}</span>
        <span style="font-size: 11px; font-weight: 600">{{d.badge}}</span>
      </button>
    </sc-for>
  </div>

  <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">{{dayTitle}}</h2>
      <div style="font-size: 13px; color: #6E5560">{{freeCount}}</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
        <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.selected}}" style="{{s.slotStyle}}">{{s.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: #6E5560">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
      <span>Solo ves horarios libres. Hora del centro de México.</span>
    </div>
  </div>

  <div style="flex: 1"></div>

  <div style="padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #EADBD9; background: #FFFFFF">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B2A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
      <div style="font-size: 15px; font-weight: 700">{{summary}}</div>
    </div>
    <a href="Datos.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 14px; background: #6B2A45; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">
      Continuar
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: '6', slot: '16:30' }; }
  renderVals() {
    const all = ['15:30', '16:00', '16:30', '17:00', '17:30'];
    const label = { '15:30': '3:30 pm', '16:00': '4:00 pm', '16:30': '4:30 pm', '17:00': '5:00 pm', '17:30': '5:30 pm' };
    const days = [
      { id: '5', dow: 'Lun', num: '5', long: 'Lunes 5 de octubre', free: ['16:00', '17:30'] },
      { id: '6', dow: 'Mar', num: '6', long: 'Martes 6 de octubre', free: ['15:30', '16:30', '17:30'] },
      { id: '7', dow: 'Mié', num: '7', long: 'Miércoles 7 de octubre', free: [] },
      { id: '8', dow: 'Jue', num: '8', long: 'Jueves 8 de octubre', free: all },
      { id: '9', dow: 'Vie', num: '9', long: 'Viernes 9 de octubre', free: ['15:30', '16:00', '17:00'] },
      { id: '12', dow: 'Lun', num: '12', long: 'Lunes 12 de octubre', free: all },
      { id: '13', dow: 'Mar', num: '13', long: 'Martes 13 de octubre', free: all }
    ];
    const cur = days.find((d) => d.id === this.state.day) || days[1];
    const chipBase = 'flex: none; width: 60px; height: 78px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: inherit; cursor: pointer; ';
    const slotBase = 'height: 52px; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; ';
    const slotSel = cur.free.includes(this.state.slot) ? this.state.slot : null;
    const n = cur.free.length;
    return {
      days: days.map((d) => {
        const full = d.free.length === 0;
        const selected = d.id === cur.id;
        let style = chipBase;
        if (full) style += 'background: transparent; border: 1.5px dashed #D9C2C4; color: #7E626C; cursor: not-allowed;';
        else if (selected) style += 'background: #6B2A45; border: 1.5px solid #6B2A45; color: #FFFFFF;';
        else style += 'background: #FFFFFF; border: 1.5px solid #EADBD9; color: #3A1F29;';
        return {
          ...d, full, selected,
          badge: full ? 'Lleno' : d.free.length + ' libres',
          aria: d.long + (full ? ', sin horarios' : ', ' + d.free.length + ' horarios libres'),
          chipStyle: style,
          pick: () => { if (!full) this.setState({ day: d.id, slot: null }); }
        };
      }),
      dayTitle: cur.long,
      freeCount: n === 1 ? '1 horario libre' : n + ' horarios libres',
      slots: cur.free.map((t) => {
        const selected = t === slotSel;
        return {
          label: label[t], selected,
          slotStyle: slotBase + (selected ? 'background: #6B2A45; color: #FFFFFF; border: 2px solid #6B2A45; box-shadow: 0 0 0 4px #F4E6E6;' : 'background: #FFFFFF; color: #3A1F29; border: 2px solid #EADBD9;'),
          pick: () => this.setState({ slot: t })
        };
      }),
      summary: slotSel ? cur.long.replace(' de octubre', ' oct') + ' · ' + label[slotSel] : 'Elige una hora'
    };
  }
}
</script>
</body>
</html>
