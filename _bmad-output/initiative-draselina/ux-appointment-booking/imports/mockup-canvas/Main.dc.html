<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agendar cita — tipo de consulta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B2A45}a:hover{color:#4F1E33}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #FBF6F5; color: #3A1F29; font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; overflow: hidden; background: #FFFFFF; padding: 30px 20px 18px; display: flex; align-items: center; gap: 14px">
    <svg width="390" height="40" viewBox="0 0 390 110" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 40px">
      <path d="M0 0 H390 V38 C320 70 250 18 170 40 C100 60 50 30 0 52 Z" fill="#F4E6E6"></path>
      <path d="M0 0 H390 V18 C330 46 260 6 190 22 C120 38 60 10 0 28 Z" fill="#E6CDCD"></path>
    </svg>
    <img src="/_blob/d0e3c41ddd3b2e1c6726a1286daa6bde" alt="Dra. Selina Medina Castillo · Traumatología y Ortopedia" style="position: relative; width: 92px; height: 92px; display: block; flex: none">
    <div style="position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 700; color: #6B2A45">Dra. Selina Medina Castillo</div>
        <div style="font-size: 10px; font-weight: 600; color: #8A4F5A; text-transform: uppercase; letter-spacing: 0.14em">Traumatología y Ortopedia</div>
      </div>
      <h1 style="margin: 2px 0 0; font-size: 19px; line-height: 1.2; font-weight: 600; color: #3A1F29">Agenda en un minuto</h1>
      <div style="display: flex; flex-direction: column; gap: 3px; color: #5A2339; font-size: 12px; font-weight: 500">
        <div style="display: flex; align-items: center; gap: 6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          Lun–Vie · 3:30–6:00 pm
        </div>
        <div style="display: flex; align-items: center; gap: 6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
          <span>Hospital Star Médica</span>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 6px" aria-label="Paso 1 de 3">
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #6B2A45"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #E7D3D3"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #E7D3D3"></div>
    </div>
    <div style="font-size: 12px; font-weight: 600; color: #8A4F5A; text-transform: uppercase; letter-spacing: 0.14em">Paso 1 de 3</div>
    <h2 style="margin: 4px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em">¿Qué tipo de consulta necesitas?</h2>
  </div>

  <fieldset style="border: 0; margin: 0; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tipo de consulta</legend>
    <sc-for list="{{types}}" as="t" hint-placeholder-count="2">
      <label style="{{t.cardStyle}}">
        <input type="radio" name="tipo" value="{{t.id}}" checked="{{t.selected}}" onChange="{{t.pick}}" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #6B2A45; flex: none">
        <div style="display: flex; flex-direction: column; gap: 4px; flex: 1">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
            <div style="font-size: 16px; font-weight: 700">{{t.name}}</div>
            <div style="font-size: 13px; font-weight: 600; color: #6E5560; white-space: nowrap">30 min</div>
          </div>
          <div style="font-size: 14px; line-height: 1.45; color: #6E5560">{{t.desc}}</div>
        </div>
      </label>
    </sc-for>
  </fieldset>

  <div style="flex: 1"></div>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #FBF6F5; border-top: 1px solid #EADBD9">
    <a href="Horario.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 14px; background: #6B2A45; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">
      Ver horarios disponibles
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <div style="font-size: 13px; line-height: 1.45; color: #6E5560; text-align: center">Sin cuenta ni app. Tu cita queda confirmada al instante.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'primera' }; }
  renderVals() {
    const base = 'display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 16px; background: #FFFFFF; cursor: pointer; min-height: 44px; box-sizing: border-box; ';
    const list = [
      { id: 'primera', name: 'Primera consulta', desc: 'Valoración de una lesión o molestia nueva: rodilla, hombro, columna, fracturas.' },
      { id: 'seguimiento', name: 'Consulta de seguimiento', desc: 'Revisión de un tratamiento, estudio o cirugía que ya lleva la doctora.' }
    ];
    return {
      types: list.map((t) => {
        const selected = this.state.picked === t.id;
        return {
          ...t,
          selected,
          cardStyle: base + (selected ? 'border: 2px solid #6B2A45; box-shadow: 0 0 0 4px #F4E6E6;' : 'border: 2px solid #EADBD9;'),
          pick: () => this.setState({ picked: t.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
