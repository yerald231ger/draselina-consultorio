# Historias de epic-sitio-del-consultorio, en orden de construcción.

[[entry]]
id = 1
type = "story"
title = "Ubicación y horarios desde la Agenda base"
description = "Camino trazador: la consulta pública HorarioDeAtencion (IQuery<IReadOnlyList<DiaDeLaBase>>, sin IRequiereAdministrador, solo lee) con su handler en Features y un formateador que agrupa los días con los mismos Tramos (días seguidos como rango, \"Lunes a viernes · 3:30 a 6:00 pm, con cita\"; sueltos como lista, \"Lunes, miércoles y viernes\"; sin Agendas custom); Inicio.razor rehecho con el encabezado del sitio (logotipo, anclas a las secciones y \"Agendar cita\" a /reservar), una portada mínima y la sección Ubicación y horarios: lugar, dirección, horario agrupado, WhatsApp (nulo: \"escríbenos por WhatsApp\"), \"Cómo llegar\" con EnlaceDelMapa y el iframe de Google Maps sin clave con loading=\"lazy\" y title; [ASSUMPTION: el encabezado con anclas y botón va solo en / y en el Aviso de privacidad; la reserva y la gestión conservan su encabezado actual]. HorarioDeAtencion es el que la entrada 4 usa para el JSON-LD."
verify = "Con el AppHost arriba, Gerardo abre el sábado 10:00–13:00 en Configuración y / muestra \"Sábado · 10:00 am a 1:00 pm\"; pruebas unitarias del agrupado (rango, lista, dos Tramos en un día, semana sin atención), de integración de HorarioDeAtencion sin sesión, y HTTP de / con \"Agendar cita\" en el encabezado hacia /reservar y sin blazor.web.js."
covers = ["CAP-21"]
after = ["2.2", "2.5", "6.4"]
hitl = false
risk = "medium"
references = ["ux-appointment-booking/imports/mockup-canvas/SitioInicio.dc.html", "ux-appointment-booking/imports/mockup-canvas/SitioMovil.dc.html"]

