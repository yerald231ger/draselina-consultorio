# Historias de epic-gestion-por-el-paciente, en orden de construcción.

[[entry]]
id = 1
type = "story"
title = "Tu cita con el enlace"
description = "Camino trazador: la página Tu cita en /c/{token} (mockup Gestionar, SSR estático) con la consulta CitaPorEnlace, que busca la Cita por el hash del token y que usan las entradas 3 y 4, muestra fecha, hora, tipo, lugar y \"Agregar a mi calendario\" en sus tres estados (Agendada; cancelada por el Paciente o tarde, con \"Agendar otra cita\"; cancelada por el Consultorio, con la disculpa y \"Elegir otro horario\"); un token mal formado, inexistente o de una Cita cuyo inicio ya pasó muestra Enlace no válido; todas las páginas /c/... llevan noindex (encabezado X-Robots-Tag y meta), Cache-Control no-store y la política DemasiadosIntentos."
verify = "Con el AppHost arriba, el enlace de Cita confirmada abre Tu cita; pruebas comprueban que el enlace de una Cita no muestra otra, que un token alterado, inexistente o de una Cita ya empezada (reloj inyectado) da Enlace no válido, que la respuesta trae noindex y que una Cita sembrada con motivo Consultorio muestra la disculpa."
covers = ["CAP-6"]
after = ["2.9", "2.10", "2.11"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Reprogramar en el dominio y el caso de uso"
description = "cita.Reprogramar(nuevoRango, reglas, now) (solo Agendada, mientras falte al menos el umbral de cancelación tardía para su inicio actual, INV-C4 y C5 sobre el nuevo rango, sin tope semanal, fin con la duración del tipo de ese momento por INV-C3, mismo CitaId y token_hash) y el comando ReprogramarCitaPorEnlace (token, fecha, hora) que la entrada 3 envía: toma el candado de la fecha local nueva (AD-26) y lee los tramos después, traduce un traslape a horario ocupado, y deja bitácora Reprogramada con antes y después y CitaReprogramada (InicioAnterior, InicioNuevo, FinNuevo, sin datos personales) en la misma transacción; un token que no vale vuelve como enlace no válido y reprogramar a la hora en la que la Cita ya está devuelve éxito sin bitácora ni evento."
verify = "Pruebas de dominio rechazan dentro del umbral, fuera de la rejilla y fuera de la ventana, y mueven una Cita aunque el teléfono tenga tres en la semana; pruebas de integración comprueban que la Cita conserva CitaId y token_hash, que quedan la bitácora con actor Paciente y CitaReprogramada pendiente en agenda.outbox, que un traslape devuelve horario ocupado sin cambiar nada y que repetir no deja una segunda bitácora."
covers = ["CAP-7", "CAP-17"]
after = [1, "2.4", "2.6"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Reprogramar desde Tu cita"
description = "Tu cita muestra \"Reprogramar\" solo mientras falte al menos el umbral y, dentro de él, el panel ámbar \"Faltan menos de 2 horas\" con \"¿Buscabas otro horario?\"; /c/{token}/reprogramar reutiliza Día y hora en móvil y escritorio con la Cita actual visible y sin paso de tipo, con HorariosLibres que recibe un CitaId opcional para apartar la propia Cita y marcarla \"Tu hora actual\"; confirmar envía ReprogramarCitaPorEnlace de la entrada 2 y muestra Cita reprogramada con la nueva fecha; si el horario se ocupó, vuelve a Día y hora con el aviso y los horarios restantes, y dentro del umbral explica que hay que cancelar y volver a agendar."
verify = "Pruebas de componente e integración: a más del umbral Tu cita ofrece Reprogramar y a menos no; la hora actual se ve y no se elige; reprogramar a otra hora muestra Cita reprogramada con la nueva fecha; un horario tomado al confirmar vuelve a Día y hora con el aviso."
covers = ["CAP-7"]
after = [2, "2.5", "2.8", "2.12"]
hitl = false
risk = "medium"

