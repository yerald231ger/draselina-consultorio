title = "Pantalla: Citas que quedan fuera y quitar el horario propio"
description = "Sobre el Calendario de la entrada 1 y los comandos de la entrada 2: antes de guardar o quitar, la lista de Citas que quedan fuera con las que no tienen correo señaladas (IPacientesApi.ObtenerContactos), cancelar o conservar por Cita con la preselección del Assumption de RN-10 y el atajo \"cancelar todas\"; el aviso de conflicto que vuelve a cargar la lista; \"Quitar horario propio\" dice a qué Tramos de la base vuelve el día; y \"no se atiende\", \"horario especial\" y \"día abierto\" se leen distintos (EXPERIENCE.md, estados del Administrador)."
verify = "Pruebas bUnit y de integración: con Citas fuera aparece la lista antes de guardar, la Cita sin correo se señala, \"cancelar todas\" marca todas y se puede cambiar una a conservar; un conflicto muestra el aviso y la lista nueva; quitar el horario propio dice los Tramos de la base; los tres tipos de día se distinguen en el mes."
