# Historias de epic-agenda-de-atencion-y-configuracion, en orden de construcción.

[[entry]]
id = 1
type = "story"
title = "Dar horario propio a una fecha"
description = "Camino trazador: agrega \"Calendario de atención\" a la navegación; el mes muestra en cada fecha sus Tramos vigentes y, si tiene custom, su motivo; al tocar una fecha, el formulario de Tramos y motivo; el comando GuardarAgendaCustom (IRequiereAdministrador) registra o cambia la custom con el candado de fecha (AD-26) y deja la bitácora AgendaCustom a nombre del Administrador con su id; incluye el servicio \"Citas que quedan fuera\" (AD-6: no cabe completa en un solo Tramo vigente), que reusa la entrada 4, y con él el comando devuelve conflicto si quedan Citas fuera que no venían en la lista vista (aquí siempre vacía; la elección por Cita es de la entrada 2)."
verify = "Con el AppHost arriba, Gerardo da al sábado 10:00–13:00 con motivo \"sábado abierto\" y ese sábado aparece en /reservar con Horarios libres y el siguiente no; pruebas de integración: un Tramo encimado o donde no cabe una Cita se rechaza, una fecha con Citas fuera devuelve conflicto sin guardar nada, la bitácora dice Administrador, y sin sesión el comando vuelve No autorizado."
covers = ["CAP-11", "CAP-17"]
after = ["5.1", "2.4", "2.6"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Elegir cita por cita: evento interno y P-1"
description = "GuardarAgendaCustom y BorrarAgendaCustom reciben la lista completa vista con la decisión cancelar o conservar por Cita y devuelven conflicto si no coincide con las que quedan fuera (RN-9, sobre el servicio de la entrada 1); AgendaAtencion levanta sus eventos de dominio, AgendaCustomFueRegistrada, Cambiada y Borrada con las Citas elegidas y el actor, y también AgendaBaseFueCambiada que usa la entrada 4; el evento de custom va al outbox en la misma transacción (T-30) y la política P-1, handler en Features, cancela cada Cita elegida en su propia transacción con cita.CancelarPorConsultorio, el actor del evento (T-31) y su bitácora, omite las que ya no estén Agendadas (T-29) y publica CitaCancelada con motivo consultorio, cuya disculpa envía el handler existente de la 4.4."
verify = "Pruebas de dominio e integración: cerrar un sábado con cuatro Citas, cancelando tres y conservando la de las 12:30, deja tres Canceladas por el Consultorio a nombre del Administrador con su disculpa en el canal de prueba y la de las 12:30 intacta y sin aviso; entregar el evento dos veces no cambia nada; una lista que ya no coincide devuelve conflicto y no cambia ni la custom ni las Citas; borrar la custom que abría un sábado con Citas pide la misma elección."
covers = ["CAP-11", "CAP-17"]
after = [1, "5.5", "4.4"]
hitl = false
risk = "high"

[[entry]]
id = 3
