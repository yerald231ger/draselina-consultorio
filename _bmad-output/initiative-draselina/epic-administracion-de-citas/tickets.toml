title = "Cita del consultorio en el dominio y el caso de uso"
description = "Cita.AgendarPorConsultorio (INV-C6, RN-13, RN-14): ignora rejilla, ventana, Tramos y tope, exige nota cuando cae fuera de los Tramos vigentes y solo la impiden el traslape (23P01 a conflicto, AD-8) o la hora pasada (INV-C4); el comando AgendarCitaPorConsultorio (IRequiereAdministrador) que hace BuscarOCrear del Paciente, registra el Consentimiento con canal externo (supuesto de FR-15) y el motivo de consulta opcional, deja la bitácora a nombre del Administrador con su id de la entrada 1 y publica CitaAgendada con origen consultorio, cuya confirmación envía el handler existente de la 4.1 (supuesto de FR-21). [ASSUMPTION: si toma el candado de fecha de AD-26 lo decide quien la construye; AD-26 no lo pide.] La pantalla es de la entrada 4."
verify = "Pruebas de dominio e integración: un sábado cerrado a las 10:15 sin nota se rechaza y con nota se guarda, y HorariosLibres sigue sin ofrecer ese sábado; un traslape o una hora pasada se rechazan con su código; sin sesión vuelve No autorizado; la bitácora dice Administrador con su id; con correo sale la confirmación."
covers = ["CAP-13", "CAP-17"]
after = [1, "2.6", "4.1"]
hitl = false
risk = "high"

