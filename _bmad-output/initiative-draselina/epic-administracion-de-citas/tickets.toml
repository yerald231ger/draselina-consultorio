description = "Sobre la página de la entrada 1: vista de semana y navegación entre días; las tarjetas de EXPERIENCE.md (Atendida derivada y atenuada, No se presentó, Canceladas ocultas tras un filtro distinguiendo por Paciente, tardía y por el Consultorio, \"sin correo\", la Cita del consultorio fuera de horario con su nota, la fecha con Agenda custom y su motivo, \"No hay citas este día\"); refresco cada 30 segundos (AD-11) y la vista del día usable en teléfono; y el traspaso de la épica 4: \"Abrir la Agenda\" en la alerta de cancelación tardía apunta a la ruta de la Agenda. Los enlaces de las tarjetas al Detalle de Cita los agrega la entrada 6."
