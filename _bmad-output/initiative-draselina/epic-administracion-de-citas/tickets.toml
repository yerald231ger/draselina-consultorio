# Historias de epic-administracion-de-citas, en orden de construcción.

[[entry]]
id = 1
type = "story"
title = "Entrar con segundo factor y ver las citas del día"
description = "Camino trazador: ASP.NET Core Identity en el host con su DbContext en el esquema identidad, migrado por el MigrationService, que siembra la cuenta del Administrador ([ASSUMPTION: contraseña de un parámetro secreto del AppHost en user-secrets y correo de la configuración]) sin registro público; inicio de sesión y segundo factor TOTP en SSR estático, con enrolamiento por QR la primera vez y los códigos de recuperación y el bloqueo que trae Identity [ASSUMPTION]; el área /admin [ASSUMPTION: prefijo] en Interactive Server con su layout, la navegación con solo lo que existe (Agenda y Salir; Decision del 2026-11-09), sesión exigida y noindex (la parte de CAP-21 que le toca); IActorActual entrega también el id del Administrador para actor_id; IPacientesApi.ObtenerContactos en lote (AD-10), que usan las entradas 2, 6 y 7; y la consulta de administración CitasDelDia(fecha) (IRequiereAdministrador) con la página Agenda que lista hora, Paciente, motivo y estado, que la entrada 2 completa."
verify = "Con el AppHost arriba, Gerardo escanea el QR, entra con el código y ve las citas de hoy; pruebas de integración comprueban que sin sesión /admin redirige al inicio de sesión y CitasDelDia vuelve No autorizado, que con contraseña y sin segundo factor no se entra, y que no existe ruta de registro."
covers = ["CAP-9", "CAP-12"]
after = ["1.7", "2.1", "4.1"]
hitl = true
risk = "high"

