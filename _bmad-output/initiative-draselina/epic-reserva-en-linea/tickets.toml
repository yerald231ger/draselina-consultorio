[[entry]]
id = 8
type = "story"
title = "Horario tomado y doble envío"
description = "Tus datos lleva un SolicitudId generado al pintarse que la Cita guarda, y un segundo envío con el mismo SolicitudId devuelve la Cita ya creada (AD-27); si el horario se ocupó al confirmar, la página vuelve a Día y hora con los datos conservados en el cuerpo del formulario, el aviso y los Horarios libres restantes, nunca un error."
verify = "Pruebas de integración: dos reservas simultáneas del mismo horario dan exactamente una Cita y la otra recibe conflicto; enviar dos veces el mismo formulario devuelve la misma Cita; una prueba de componente muestra Día y hora con el aviso y los datos conservados."
covers = ["CAP-3"]
after = [5, 7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Enlace de gestión en la confirmación"
description = "El Enlace de gestión derivado con HMAC-SHA256 de la clave del host (fuera de la base, como parámetro del AppHost) y el CitaId, del que la Cita guarda solo el hash, servido por IAgendaApi.ObtenerEnlaceDeGestion; Cita confirmada lo muestra con \"Guarda este enlace\" y con los estados con correo y sin correo de EXPERIENCE.md."
verify = "Una prueba comprueba que el enlace de una Cita es estable, que la base guarda solo su hash y que el de otra Cita es distinto; Cita confirmada muestra el enlace y cambia su texto según haya correo o no."
covers = ["CAP-2"]
after = [8]
hitl = false
risk = "medium"

