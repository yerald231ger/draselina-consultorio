description = "AgendarCitaEnLinea toma el candado consultivo de la fecha local (AD-26), lee los tramos vigentes después de tomarlo, arma ReglasDeAgenda con ReglasDeReserva, y Cita.Agendar exige INV-C5 (cabe en un tramo, empieza en la rejilla de la entrada 3, dentro de la ventana)."
verify = "Pruebas de integración: una reserva a las 3:45 pm, en sábado sin custom, hoy o después de la ventana se rechaza con su código; una a las 4:00 pm de un día de atención se guarda."
