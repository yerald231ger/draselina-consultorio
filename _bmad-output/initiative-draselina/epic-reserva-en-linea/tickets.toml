# Historias de epic-reserva-en-linea, en orden de construcción.

[[entry]]
id = 1
type = "story"
title = "Una reserva en línea se guarda de punta a punta"
description = "Camino trazador: la página Tus datos (nombre, celular válido para México, correo opcional, motivo y Consentimiento, con tipo, fecha y hora en la cadena de consulta como tipo=<TipoDeVisitaId>&fecha=AAAA-MM-DD&hora=HH:mm) envía AgendarCitaEnLinea, que reconoce o registra al Paciente con IPacientesApi.BuscarOCrear (índice único con collation ICU), guarda la Cita con su Consentimiento y la restricción de exclusión de PostgreSQL (traducida a conflicto), y muestra Cita confirmada con fecha, hora y dirección; crea tipo_de_visita con sus dos tipos sembrados e IContenidoApi con los datos del consultorio y la versión del aviso de privacidad, que usan las entradas 5 y 10; la migración comprueba si la restricción necesita btree_gist y lo anota como Decision en la épica."
verify = "Con el AppHost arriba, abrir Tus datos con un tipo, fecha y hora, enviar y ver Cita confirmada; pruebas de integración comprueban que mismo teléfono y nombre (sin distinguir mayúsculas, acentos ni espacios) dan el mismo Paciente, otro nombre da otro, y que una segunda Cita traslapada vuelve como conflicto."
covers = ["CAP-2", "CAP-3", "CAP-4"]
after = ["1.3", "1.4", "1.5", "1.6", "1.9"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Agenda de atención y reglas de reserva sembradas"
description = "AgendaAtencion (agenda base por día de la semana y agendas custom por fecha, con INV-B1 a B5, INV-A1 a A6 e INV-V1) y ReglasDeReserva, con sus tablas, sus puertos de escritura y sus datos iniciales (lunes a viernes 15:30 a 18:00 y los valores de reglas_de_reserva); los comandos que los cambian quedan para la épica 6."
verify = "Pruebas de dominio comprueban INV-V1 (una fecha con custom usa sus tramos, una sin custom los de la base, un sábado sin custom no tiene tramos) y una prueba de integración lee la agenda sembrada desde la base migrada."
covers = ["CAP-1"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Horarios libres calculados"
description = "CalculadoraDeDisponibilidad como función pura (tramos vigentes por fecha, rejilla por duración, sin traslapes con Citas activas de cualquier origen, desde mañana y dentro de la ventana) y la consulta de Horarios libres por Tipo de visita que la usa; es la única implementación de la rejilla, que la entrada 4 reutiliza."
verify = "Pruebas de la calculadora: con la base sembrada un día de atención ofrece como máximo 3:30, 4:00, 4:30, 5:00 y 5:30 pm, y no aparecen horarios de hoy, de fechas sin tramos, posteriores a la ventana ni traslapados con una Cita, incluida una manual fuera de horario."
covers = ["CAP-1"]
after = [2]
hitl = false
risk = "medium"

